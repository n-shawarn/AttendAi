<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sections — AttendAI Admin</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-icon" style="background:var(--gradient-rose);">🎯</div><span class="brand-text">AttendAI</span></div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a class="nav-item" href="users.html"><span class="nav-icon">👥</span> Users</a>
      <a class="nav-item active" href="sections.html"><span class="nav-icon">🏫</span> Sections</a>
      <a class="nav-item" href="settings.html"><span class="nav-icon">⚙️</span> Settings</a>
    </nav>
    <div style="border-top:1px solid var(--border-subtle);padding-top:var(--space-md);margin-top:auto;">
      <div class="nav-item" onclick="logout()" style="color:var(--accent-rose);cursor:pointer;"><span class="nav-icon"><i class="fas fa-sign-out-alt"></i></span> Sign Out</div>
    </div>
  </aside>
  <main class="main-content">
    <div class="top-bar"><h1>🏫 Sections</h1>
      <button class="btn btn-primary" onclick="document.getElementById('addModal').classList.add('active')">+ Add Section</button>
    </div>
    <div class="glass-card" id="sectionsList">
      <div class="empty-state"><div class="empty-icon"><i class="fas fa-building-columns" style="font-size:1.5rem;color:var(--accent-emerald);"></i></div><h3>No sections</h3></div>
    </div>
  </main>
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <div class="modal-header"><h3>Add Section</h3><button class="modal-close" onclick="document.getElementById('addModal').classList.remove('active')">×</button></div>
      <form onsubmit="addSection(event)" style="display:flex;flex-direction:column;gap:var(--space-md);">
        <div class="form-group"><label class="form-label">Name *</label><input class="form-input" id="sName" required placeholder="CSE-A"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);">
          <div class="form-group"><label class="form-label">Department</label><input class="form-input" id="sDept" placeholder="CS"></div>
          <div class="form-group"><label class="form-label">Semester</label><input class="form-input" id="sSem" placeholder="4th"></div>
        </div>
        <div class="form-group"><label class="form-label">Academic Year</label><input class="form-input" id="sYear" placeholder="2025-26"></div>
        <button type="submit" class="btn btn-primary btn-lg w-full">Add Section</button>
      </form>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script>
    const API='http://localhost:5000/api';const token=localStorage.getItem('token');
    if(!token)window.location.href='../login.html?role=admin';
    const headers={'Authorization':`Bearer ${token}`,'Content-Type':'application/json'};
    async function load(){
      try{const r=await fetch(`${API}/admin/sections`,{headers});const d=await r.json();
      if(d.success&&d.sections.length>0){
        document.getElementById('sectionsList').innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-md);">${d.sections.map(s=>`
          <div style="padding:var(--space-lg);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);border-left:4px solid var(--accent-blue);">
            <div style="font-weight:700;font-size:1.1rem;margin-bottom:4px;">${s.name}</div>
            <div style="font-size:0.8rem;color:var(--text-muted);">${s.department||''} ${s.semester?'• Sem '+s.semester:''} ${s.academic_year?'• '+s.academic_year:''}</div>
          </div>`).join('')}</div>`;
      }}catch(e){console.error(e);}
    }
    async function addSection(e){
      e.preventDefault();
      try{const r=await fetch(`${API}/admin/sections`,{method:'POST',headers,body:JSON.stringify({
        name:document.getElementById('sName').value,department:document.getElementById('sDept').value,
        semester:document.getElementById('sSem').value,academic_year:document.getElementById('sYear').value
      })});const d=await r.json();
      if(d.success){showToast('Added!','success');document.getElementById('addModal').classList.remove('active');load();}
      else showToast(d.message,'error');}catch(e){showToast('Error','error');}
    }
    function logout(){localStorage.clear();window.location.href='../login.html?role=admin';}
    function showToast(m,t='info'){const c=document.getElementById('toastContainer');const e=document.createElement('div');e.className=`toast ${t}`;e.innerHTML=`<span>${t==='success'?'✅':'❌'}</span><span style="flex:1;font-size:0.9rem;">${m}</span>`;c.appendChild(e);setTimeout(()=>{e.style.opacity='0';setTimeout(()=>e.remove(),300);},4000);}
    load();
  </script>
</body>
</html>
